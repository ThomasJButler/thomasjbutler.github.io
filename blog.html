<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting… | Tom Butler</title>

    <!--
      Legacy /blog redirect. The old target was /react.html#blog, and react.html no longer
      exists, so this used to redirect to a page that 404s. There is no blog any more; the
      Dev Journey timeline at /updates is the nearest thing, so old inbound links land
      there instead of on a dead page.
    -->
    <meta http-equiv="refresh" content="0; url=/updates">
    <link rel="canonical" href="https://thomasjbutler.github.io/updates">
    <meta name="robots" content="noindex">

    <style>
        body {
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        a { color: #00ff41; }
    </style>

    <script>
        window.location.replace('/updates');
    </script>
</head>
<body>
    <div>
        <p>Redirecting… if nothing happens, <a href="/updates">continue to the site</a>.</p>
    </div>
</body>
</html>
