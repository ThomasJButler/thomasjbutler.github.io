<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix v3.5 — UI Kit · Thomas J Butler</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="matrix.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-theme="matrix">
  <div id="root"></div>

  <script type="text/babel" src="Chrome.jsx"></script>
  <script type="text/babel" src="HomePage.jsx"></script>
  <script type="text/babel" src="Pages.jsx"></script>

  <script type="text/babel">
    function App() {
      const [page, setPage] = React.useState('home');
      // Persist current page across reloads
      React.useEffect(() => {
        const saved = localStorage.getItem('m35:page');
        if (saved) setPage(saved);
      }, []);
      React.useEffect(() => {
        localStorage.setItem('m35:page', page);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, [page]);

      let body = null;
      if (page === 'home')     body = <MatrixHomePage onNavigate={setPage} />;
      else if (page === 'projects') body = <MatrixProjectsPage />;
      else if (page === 'about')    body = <MatrixAboutPage />;
      else if (page === 'services') body = <MatrixServicesPage />;
      else if (page === 'contact')  body = <MatrixContactPage />;

      return (
        <>
          <MatrixRain />
          <div className="vignette-overlay" aria-hidden="true" />
          <div className="scanlines-overlay" aria-hidden="true" />
          <Header active={page} onNavigate={setPage} />
          <main data-screen-label={page}>
            {body}
          </main>
          <Footer />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
