<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="_chrome.css">
<style>
  .wrap { padding: 28px 40px; position: relative; z-index: 5; }
  .now {
    padding: 22px;
    border-radius: 12px;
    background: linear-gradient(180deg,
      oklch(0.50 0.28 145 / 0.06),
      oklch(0.50 0.28 145 / 0.02));
    border: 1px solid oklch(0.50 0.28 145 / 0.25);
    border-top: 1px solid oklch(0.50 0.28 145 / 0.5);
    backdrop-filter: blur(10px) saturate(1.2);
    box-shadow:
      inset 0 1px 0 oklch(0.50 0.28 145 / 0.15),
      0 14px 30px oklch(0 0 0 / 0.4),
      0 0 28px oklch(0.50 0.28 145 / 0.12);
  }
  .h {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    font-family: 'Share Tech Mono'; font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: oklch(0.50 0.28 145);
  }
  .h svg { width: 14px; height: 14px; }
  .h .now-dot { width: 6px; height: 6px; border-radius: 50%;
                 background: oklch(0.65 0.22 145); margin-left: 4px;
                 box-shadow: 0 0 8px oklch(0.65 0.22 145);
                 animation: p 1.6s ease-in-out infinite; }
  @keyframes p { 50% { opacity: 0.4; } }
  p {
    font-family: 'Exo 2'; font-size: 14px; line-height: 1.6;
    color: oklch(0.92 0.005 145); margin: 0; max-width: 86ch;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .badge {
    display: inline-flex; align-items: center; height: 20px;
    padding: 0 9px; border-radius: 999px;
    font-family: 'Exo 2'; font-size: 11px; font-weight: 500;
  }
  .badge--c { background: oklch(0.75 0.15 195 / 0.15);
              color: oklch(0.75 0.15 195); border: 1px solid oklch(0.75 0.15 195 / 0.25); }
  .badge--a { background: oklch(0.80 0.15 85 / 0.15);
              color: oklch(0.80 0.15 85); border: 1px solid oklch(0.80 0.15 85 / 0.25); }
  .badge--s { background: oklch(0.18 0.025 145);
              color: oklch(0.85 0.12 145); }
</style></head>
<body>
<div class="sec sec--v40-dark">
  <canvas class="rain"></canvas>
  <span class="tag-version">v4.0 · now panel</span>
  <div class="wrap">
    <div class="now">
      <div class="h">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
        now <span class="now-dot"></span>
      </div>
      <p>Building AI-powered applications and exploring agentic workflows. Currently focused on RAG systems, LangChain integrations, and pushing the boundaries of what's possible with modern web tech.</p>
      <div class="tags">
        <span class="badge badge--c">LangChain</span>
        <span class="badge badge--c">RAG</span>
        <span class="badge badge--a">Agents</span>
        <span class="badge badge--s">ShadCN</span>
      </div>
    </div>
  </div>
  <script src="_rain.js"></script>
</div>
</body></html>
