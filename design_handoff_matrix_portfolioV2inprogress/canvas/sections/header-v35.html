<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="_chrome.css">
<style>
  .sec--v35 { display: flex; align-items: flex-start; padding-top: 0; }
  .hdr {
    width: 100%; height: 70px;
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.95);
    border-bottom: 1px solid rgba(0,255,0,0.25);
    backdrop-filter: blur(6px);
    position: relative; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .lg-mark {
    width: 38px; height: 38px; border-radius: 4px;
    background: oklch(0.10 0.04 145);
    border: 1px solid #00FF00;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(0,255,0,0.5);
    font-family: 'Orbitron'; font-weight: 800; font-size: 12px; color: #00FF00;
    text-shadow: 0 0 8px #00FF00;
  }
  .word { font-family: 'Orbitron'; font-size: 16px; font-weight: 400;
          letter-spacing: 0.1em; text-transform: uppercase; color: #00FF00;
          text-shadow: 0 0 10px rgba(0,255,0,0.5); }
  .socials { display: flex; gap: 8px; margin-left: 4px; }
  .socials a { color: rgba(0,255,0,0.55); }
  .socials svg { width: 14px; height: 14px; }
  nav { display: flex; align-items: center; gap: 28px; }
  nav a {
    font-family: 'Exo 2'; font-size: 13px; letter-spacing: 0.15em;
    text-transform: uppercase; color: rgba(255,255,255,0.7);
    text-decoration: none; padding: 4px 0;
    position: relative;
  }
  nav a.active { color: #fff; }
  nav a.active::after {
    content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
    height: 1px; background: #00FF00;
  }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Orbitron'; font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 6px 14px;
    border-radius: 999px; background: transparent;
    border: 1px solid rgba(0,255,0,0.3); color: #00FF00;
  }
  .below { padding: 18px 40px;
           font-family: 'Share Tech Mono', monospace; font-size: 10px;
           color: rgba(0,255,0,0.5); letter-spacing: 0.15em;
           text-transform: uppercase; }
  .below::before { content: '// '; opacity: 0.6; }
</style></head>
<body>
<div class="sec sec--v35">
  <canvas class="rain"></canvas>
  <span class="tag-version">v3.5 · matrix</span>
  <div style="position:relative; z-index:5; width:100%">
    <header class="hdr">
      <div class="brand">
        <div class="lg-mark">TB</div>
        <span class="word">Thomas J Butler</span>
        <span class="socials">

          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        </span>
      </div>
      <nav>
        <a href="#" class="active">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
        <button class="toggle">☾ Dark Mode</button>
      </nav>
    </header>
    <div class="below">heavy uppercase nav · always-on border · big toggle pill · social inline with logo</div>
  </div>
  <script src="_rain.js"></script>
</div>
</body></html>
