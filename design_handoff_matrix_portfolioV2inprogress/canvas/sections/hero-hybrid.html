<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&family=Exo+2:wght@400;500&family=Share+Tech+Mono&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="_chrome.css">
<style>
  /* Hybrid: v4.0 terminal-window frame with v3.5 UPPERCASE cyan hero typography */
  .nt-term {
    margin: 60px 60px; position: relative;
    border: 1px solid oklch(0.42 0.20 145 / 0.55);
    border-top: 1px solid oklch(0.60 0.22 145 / 0.7);
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg,
      oklch(0.10 0.02 145 / 0.85),
      oklch(0.06 0.01 145 / 0.92));
    backdrop-filter: blur(14px) saturate(1.3);
    box-shadow:
      0 1px 0 oklch(0.60 0.22 145 / 0.18) inset,
      0 14px 30px oklch(0 0 0 / 0.5),
      0 0 36px oklch(0.50 0.28 145 / 0.20),
      0 22px 50px oklch(0.50 0.28 145 / 0.15);
  }
  /* Inner scanline texture */
  .nt-term::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 3px,
      oklch(0.50 0.28 145 / 0.03) 3px, oklch(0.50 0.28 145 / 0.03) 4px);
  }
  /* Sweeping bottom edge */
  .nt-term::after {
    content: ''; position: absolute; bottom: 0; left: -25%;
    width: 50%; height: 2px;
    background: linear-gradient(90deg, transparent,
      oklch(0.75 0.18 195), oklch(0.50 0.28 145), transparent);
    box-shadow: 0 0 14px oklch(0.50 0.28 145 / 0.7);
    animation: sweep 4s linear infinite;
  }
  @keyframes sweep { 0% { left: -25%; } 100% { left: 100%; } }

  .bar {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 11px 16px;
    background: oklch(0.14 0.02 145 / 0.55);
    border-bottom: 1px solid oklch(0.30 0.10 145 / 0.4);
  }
  .dots { display: flex; gap: 6px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .r { background: oklch(0.65 0.20 27 / 0.75); box-shadow: 0 0 6px oklch(0.65 0.20 27 / 0.5); }
  .y { background: oklch(0.80 0.15 85 / 0.75); box-shadow: 0 0 6px oklch(0.80 0.15 85 / 0.5); }
  .g { background: oklch(0.65 0.20 145 / 0.75); box-shadow: 0 0 6px oklch(0.65 0.20 145 / 0.5); }
  .path { font-family: 'JetBrains Mono'; font-size: 11px;
          color: oklch(0.70 0.10 145); margin-left: 6px; letter-spacing: 0.02em; }
  .status {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    color: oklch(0.50 0.28 145);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .status .pulse {
    width: 5px; height: 5px; border-radius: 50%;
    background: oklch(0.65 0.22 145);
    box-shadow: 0 0 8px oklch(0.65 0.22 145);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .body { position: relative; z-index: 2;
          padding: 60px 28px 50px; text-align: center; }

  /* v3.5-style UPPERCASE cyan hero */
  .h1 {
    font-family: 'Orbitron'; font-size: 76px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #00FFFF;
    text-shadow:
      0 0 12px oklch(0.75 0.15 195 / 0.7),
      0 0 30px oklch(0.50 0.28 145 / 0.4),
      0 0 60px oklch(0.50 0.28 145 / 0.2);
    margin: 0; line-height: 0.95;
  }
  .h1::before { content: '> '; color: #00FFFF; }

  .typing {
    margin-top: 22px;
    font-family: 'Share Tech Mono', monospace; font-size: 22px;
    color: oklch(0.70 0.05 145);
  }
  .typing .pre { color: oklch(0.50 0.28 145 / 0.6); }
  .typing .word { color: #00FFFF; text-shadow: 0 0 10px oklch(0.75 0.15 195 / 0.6); }
  .typing .cur { display: inline-block; width: 0.55em; height: 1.05em;
    background: #00FFFF; vertical-align: text-bottom;
    margin-left: 3px; animation: bl 1s steps(2) infinite;
    box-shadow: 0 0 10px #00FFFF; border-radius: 1px; }
  @keyframes bl { 50% { opacity: 0; } }

  .sub {
    font-family: 'Exo 2'; font-size: 16px;
    color: oklch(0.78 0.02 145); margin-top: 12px;
    letter-spacing: 0.02em;
  }
  .cta { display: flex; gap: 14px; justify-content: center; margin-top: 36px; }
  .btn {
    height: 44px; padding: 0 22px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    letter-spacing: 0.18em; text-transform: uppercase;
    border: 1px solid oklch(0.50 0.28 145 / 0.5); cursor: pointer;
    position: relative; overflow: hidden;
    transition: all 0.25s;
  }
  .btn--p { background: oklch(0.50 0.28 145 / 0.18); color: #fff;
            box-shadow: 0 0 18px oklch(0.50 0.28 145 / 0.35),
                        inset 0 0 16px oklch(0.50 0.28 145 / 0.12); }
  .btn--o { background: transparent; color: #00FFFF;
            border-color: oklch(0.75 0.15 195 / 0.5);
            box-shadow: 0 0 12px oklch(0.75 0.15 195 / 0.2); }
  .btn::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px,
      currentColor 2px, currentColor 3px);
    opacity: 0.05;
  }
</style></head>
<body>
<div class="sec sec--hybrid">
  <canvas class="rain"></canvas>
  <span class="tag-version">hybrid · proposed</span>
  <div class="nt-term">
    <div class="bar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <span class="path">tom@matrix ~</span>
      <span class="status"><span class="pulse"></span> online</span>
    </div>
    <div class="body">
      <h1 class="h1">HEY, I'M TOM</h1>
      <div class="typing">
        <span class="pre">// I build </span><span class="word">AI-POWERED APPS</span><span class="cur"></span>
      </div>
      <p class="sub">Full Stack AI Engineer from the UK</p>
      <div class="cta">
        <button class="btn btn--p">View Projects →</button>
        <button class="btn btn--o">Get in Touch</button>
      </div>
    </div>
  </div>
  <script src="_rain.js"></script>
</div>
</body></html>
