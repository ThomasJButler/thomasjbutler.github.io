<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2:wght@400;500&family=Share+Tech+Mono&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="_chrome.css">
<style>
  .nt-term {
    margin: 60px 60px; border: 1px solid oklch(0.30 0.12 145 / 0.45);
    border-radius: 12px; overflow: hidden;
    background: oklch(0.10 0.015 145 / 0.65);
    backdrop-filter: blur(8px);
  }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: oklch(0.14 0.02 145 / 0.5);
    border-bottom: 1px solid oklch(0.22 0.04 145);
  }
  .dots { display: flex; gap: 6px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .r { background: oklch(0.65 0.20 27 / 0.7); }
  .y { background: oklch(0.80 0.15 85 / 0.7); }
  .g { background: oklch(0.65 0.20 145 / 0.7); }
  .path { font-family: 'JetBrains Mono'; font-size: 11px;
          color: oklch(0.60 0.03 145); margin-left: 4px; }
  .body { padding: 80px 28px 80px; text-align: center; }
  .h1 {
    font-family: 'Orbitron'; font-size: 84px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1;
    color: oklch(0.95 0.005 145);
    text-shadow: 0 0 10px oklch(0.50 0.28 145 / 0.35),
                 0 0 30px oklch(0.50 0.28 145 / 0.15),
                 0 0 60px oklch(0.50 0.28 145 / 0.05);
    margin: 0;
  }
  .typing {
    margin-top: 22px;
    font-family: 'Share Tech Mono', monospace; font-size: 22px;
    color: oklch(0.65 0.03 145);
  }
  .typing .pre { color: oklch(0.50 0.28 145 / 0.6); }
  .typing .word { color: oklch(0.50 0.28 145); }
  .typing .cur { display: inline-block; width: 0.55em; height: 1.05em;
    background: oklch(0.50 0.28 145 / 0.8); vertical-align: text-bottom;
    margin-left: 2px; animation: bl 1s steps(2) infinite;
    box-shadow: 0 0 8px oklch(0.50 0.28 145 / 0.4); border-radius: 1px; }
  @keyframes bl { 50% { opacity: 0; } }
  .sub { font-family: 'Exo 2'; font-size: 16px;
         color: oklch(0.65 0.03 145); margin-top: 14px; }
  .cta { display: flex; gap: 14px; justify-content: center; margin-top: 36px; }
  .btn {
    height: 42px; padding: 0 20px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Exo 2'; font-weight: 500; font-size: 14px;
    border: none; cursor: pointer;
  }
  .btn--p { background: oklch(0.50 0.28 145); color: oklch(0.08 0.01 145);
            box-shadow: 0 0 16px oklch(0.50 0.28 145 / 0.18); }
  .btn--o { background: transparent; color: oklch(0.95 0.005 145);
            border: 1px solid oklch(0.50 0.28 145 / 0.3); }
</style></head>
<body>
<div class="sec sec--v40-dark">
  <canvas class="rain"></canvas>
  <span class="tag-version">v4.0 · neon terminal</span>
  <div class="nt-term">
    <div class="bar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <span class="path">tom@matrix ~ </span>
    </div>
    <div class="body">
      <h1 class="h1">Hey, I'm Tom</h1>
      <div class="typing">
        <span class="pre">// I build </span><span class="word">AI-powered apps</span><span class="cur"></span>
      </div>
      <p class="sub">Full Stack AI Engineer from the UK</p>
      <div class="cta">
        <button class="btn btn--p">View Projects →</button>
        <button class="btn btn--o">Get in Touch</button>
      </div>
    </div>
  </div>
  <script src="_rain.js"></script>
</div>
</body></html>
