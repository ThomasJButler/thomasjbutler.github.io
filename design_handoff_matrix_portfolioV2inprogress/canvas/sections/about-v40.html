<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron&family=Exo+2&family=Share+Tech+Mono&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="_chrome.css">
<style>
  .wrap { padding: 28px 40px; position: relative; z-index: 5; }
  .term {
    border: 1px solid oklch(0.30 0.10 145 / 0.4);
    border-radius: 10px; overflow: hidden;
    background: oklch(0.10 0.015 145 / 0.7);
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 26px oklch(0 0 0 / 0.4);
  }
  .cmd {
    padding: 8px 18px;
    background: oklch(0.14 0.02 145 / 0.55);
    border-bottom: 1px solid oklch(0.22 0.04 145);
    font-family: 'JetBrains Mono'; font-size: 11px;
    color: oklch(0.50 0.28 145);
  }
  .body { padding: 20px 22px; }
  .body p { margin: 0; font-family: 'Exo 2'; font-size: 14px; line-height: 1.65;
            color: oklch(0.78 0.02 145); max-width: 80ch; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .btn { height: 28px; padding: 0 10px; border-radius: 6px;
         display: inline-flex; align-items: center; gap: 6px;
         font-family: 'Exo 2'; font-size: 12px; color: oklch(0.65 0.03 145);
         background: transparent; border: 0; }
  .btn svg { width: 12px; height: 12px; }
</style></head>
<body>
<div class="sec sec--v40-dark">
  <span class="tag-version">v4.0 · $ cat about.md</span>
  <div class="wrap">
    <div class="term">
      <div class="cmd">$ cat about.md</div>
      <div class="body">
        <p>Ever since I watched The Matrix as a kid, I've been obsessed with building things on the web. This site is the sci-fi playground I always dreamed of — a space to experiment with AI, cyberpunk aesthetics, and creative code.</p>
        <div class="actions">
          <button class="btn">More about me <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
          <button class="btn">Commercial portfolio ↗</button>
          <button class="btn">GitHub</button>
          <button class="btn">TimeTravel ↗</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
