<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix Portfolio — Design Canvas · v3.5 / v4.0 / Hybrid</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Exo+2&family=Share+Tech+Mono&display=swap">
  <style>
    html, body { margin: 0; height: 100%;
                  background: #0a0a0a; color: #eee;
                  font-family: 'Exo 2', sans-serif; }
    #root { width: 100vw; height: 100vh; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Iframe wrapper for section snapshots. Iframes render at native size and the
    // canvas's zoom scaling handles the rest.
    function Sec({ src }) {
      return (
        <iframe
          src={src}
          loading="lazy"
          style={{ width: '100%', height: '100%', border: 0, display: 'block', background: '#000' }}
        />
      );
    }

    const W = 1100;

    function App() {
      return (
        <DesignCanvas defaultGap={56}>
          <DCSection id="navigation" title="Header & Navigation"
                     subtitle="Sticky top chrome — pick the era">
            <DCArtboard id="header-v35"    label="v3.5 · Matrix"
                        width={W} height={140}>
              <Sec src="sections/header-v35.html" />
            </DCArtboard>
            <DCArtboard id="header-v40"    label="v4.0 · Mission Control"
                        width={W} height={140}>
              <Sec src="sections/header-v40.html" />
            </DCArtboard>
          </DCSection>

          <DCSection id="hero" title="Hero / Landing"
                     subtitle="Three eras + one proposed blend">
            <DCArtboard id="hero-v35"        label="v3.5 · Matrix"
                        width={W} height={620}>
              <Sec src="sections/hero-v35.html" />
            </DCArtboard>
            <DCArtboard id="hero-v40-dark"   label="v4.0 · Neon Terminal (dark)"
                        width={W} height={620}>
              <Sec src="sections/hero-v40-dark.html" />
            </DCArtboard>
            <DCArtboard id="hero-v40-light"  label="v4.0 · Circuit Board (light)"
                        width={W} height={620}>
              <Sec src="sections/hero-v40-light.html" />
            </DCArtboard>
            <DCArtboard id="hero-hybrid"     label="✦ Hybrid · proposed"
                        width={W} height={620}>
              <Sec src="sections/hero-hybrid.html" />
            </DCArtboard>
          </DCSection>

          <DCSection id="status" title="System Status / Dashboard"
                     subtitle="New v4.0 surface — re-skinnable in v3.5 voice">
            <DCArtboard id="stats-v40"          label="v4.0 · System Status"
                        width={W} height={460}>
              <Sec src="sections/stats-v40.html" />
            </DCArtboard>
            <DCArtboard id="stats-v35-flavor"   label="✦ Hybrid · v3.5-flavor"
                        width={W} height={460}>
              <Sec src="sections/stats-v35-flavor.html" />
            </DCArtboard>
          </DCSection>

          <DCSection id="featured" title="Featured Projects"
                     subtitle="Same data, three card languages">
            <DCArtboard id="featured-v35"     label="v3.5 · 2-up rows"
                        width={W} height={260}>
              <Sec src="sections/featured-v35.html" />
            </DCArtboard>
            <DCArtboard id="featured-v40"     label="v4.0 · 3-up lifted"
                        width={W} height={360}>
              <Sec src="sections/featured-v40.html" />
            </DCArtboard>
            <DCArtboard id="featured-hybrid"  label="✦ Hybrid · scanline cards"
                        width={W} height={360}>
              <Sec src="sections/featured-hybrid.html" />
            </DCArtboard>
          </DCSection>

          <DCSection id="grid" title="Project Grid (filterable)"
                     subtitle="Browse-all surface">
            <DCArtboard id="grid-v35"  label="v3.5 · filter chips + neon"
                        width={W} height={720}>
              <Sec src="sections/grid-v35.html" />
            </DCArtboard>
            <DCArtboard id="grid-v40"  label="v4.0 · tabs + glass"
                        width={W} height={720}>
              <Sec src="sections/grid-v40.html" />
            </DCArtboard>
          </DCSection>

          <DCSection id="story" title="Story / About / Now"
                     subtitle="Prose surfaces — three approaches">
            <DCArtboard id="hub-v35"   label="v3.5 · ‘Why I built this’ hub"
                        width={W} height={500}>
              <Sec src="sections/hub-v35.html" />
            </DCArtboard>
            <DCArtboard id="now-v40"   label="v4.0 · Now panel"
                        width={W} height={260}>
              <Sec src="sections/now-v40.html" />
            </DCArtboard>
            <DCArtboard id="about-v40" label="v4.0 · $ cat about.md"
                        width={W} height={260}>
              <Sec src="sections/about-v40.html" />
            </DCArtboard>
          </DCSection>

          <DCSection id="footer" title="Footer"
                     subtitle="The closing voice">
            <DCArtboard id="footer-v35"  label="v3.5 · chips + // CONNECT"
                        width={W} height={120}>
              <Sec src="sections/footer-v35.html" />
            </DCArtboard>
            <DCArtboard id="footer-v40"  label="v4.0 · mono + cursor"
                        width={W} height={120}>
              <Sec src="sections/footer-v40.html" />
            </DCArtboard>
          </DCSection>

          <DCSection id="notes" title="How to use this canvas"
                     subtitle="Curate. Reorder. Delete. Tell me the mix.">
            <DCPostIt top={20}  left={40}  rotate={-3} width={260}>
              <strong>What's here.</strong>
              <br />Side-by-side artboards for every key section of v3.5 and v4.0,
              plus proposed ✦ hybrid variants that bring v3.5 personality into the v4.0 chassis.
            </DCPostIt>
            <DCPostIt top={40}  left={340} rotate={2}  width={260}>
              <strong>Curate the blend.</strong>
              <br />Drag artboards to reorder. Right-click an artboard for delete.
              What remains is your mix.
            </DCPostIt>
            <DCPostIt top={20}  left={640} rotate={-1} width={260}>
              <strong>Inspect any artboard.</strong>
              <br />Click the ⤢ corner to enter focus mode — full-screen view with
              ←/→/Esc paging.
            </DCPostIt>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
