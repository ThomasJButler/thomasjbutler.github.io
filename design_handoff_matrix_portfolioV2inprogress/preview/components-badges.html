<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 6px; }
  .b {
    height: 22px; padding: 0 10px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'Exo 2'; font-size: 11px; font-weight: 500;
    border: 1px solid transparent;
  }
  .b-default     { background: oklch(0.50 0.28 145); color: oklch(0.08 0.01 145); }
  .b-secondary   { background: oklch(0.18 0.025 145); color: oklch(0.85 0.12 145); }
  .b-outline     { background: transparent; color: oklch(0.95 0.005 145);
                   border-color: oklch(0.22 0.04 145); }
  .b-cyan        { background: oklch(0.75 0.15 195 / 0.15); color: oklch(0.75 0.15 195);
                   border-color: oklch(0.75 0.15 195 / 0.25); }
  .b-amber       { background: oklch(0.80 0.15 85 / 0.15); color: oklch(0.80 0.15 85);
                   border-color: oklch(0.80 0.15 85 / 0.25); }
  .b-destructive { background: oklch(0.55 0.20 25 / 0.1); color: oklch(0.55 0.20 25); }
  .b-ghost       { color: oklch(0.65 0.03 145); }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
         text-transform: lowercase; letter-spacing: 0.1em; }
</style></head>
<body data-theme="neon-terminal">
<div class="ds-card">
  <div class="ds-eyebrow">badges / category_chips</div>
  <span class="lab">// variants</span>
  <div class="row">
    <span class="b b-default">AI</span>
    <span class="b b-secondary">React</span>
    <span class="b b-outline">v3.5</span>
    <span class="b b-cyan">LangChain</span>
    <span class="b b-cyan">RAG</span>
    <span class="b b-amber">GSAP</span>
    <span class="b b-amber">Canvas</span>
    <span class="b b-destructive">deprecated</span>
    <span class="b b-ghost">draft</span>
  </div>
  <span class="lab" style="margin-top:6px">// status patterns</span>
  <div class="row">
    <span class="b b-default">★ featured</span>
    <span class="b b-secondary">5 stars</span>
    <span class="b b-cyan">2025</span>
    <span class="b b-amber">in progress</span>
  </div>
</div>
</body></html>
