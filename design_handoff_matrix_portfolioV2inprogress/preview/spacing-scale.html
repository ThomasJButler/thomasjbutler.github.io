<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 100px 1fr 80px; align-items: center; gap: 14px;
         font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .row .name { color: var(--text-primary); }
  .bar { background: var(--matrix-green); height: 10px; border-radius: 2px;
         box-shadow: 0 0 8px rgba(0,255,0,0.4); }
  .row .v { text-align: right; color: var(--text-primary); }
</style></head>
<body data-theme="matrix">
<div class="ds-card">
  <div class="ds-eyebrow">spacing / 4px_base</div>
  <div class="rows">
    <div class="row"><span class="name">--space-xs</span><div class="bar" style="width:4px"></div><span class="v">4 · 0.25rem</span></div>
    <div class="row"><span class="name">--space-sm</span><div class="bar" style="width:8px"></div><span class="v">8 · 0.5rem</span></div>
    <div class="row"><span class="name">--space-md</span><div class="bar" style="width:16px"></div><span class="v">16 · 1rem</span></div>
    <div class="row"><span class="name">--space-lg</span><div class="bar" style="width:24px"></div><span class="v">24 · 1.5rem</span></div>
    <div class="row"><span class="name">--space-xl</span><div class="bar" style="width:32px"></div><span class="v">32 · 2rem</span></div>
    <div class="row"><span class="name">--space-2xl</span><div class="bar" style="width:48px"></div><span class="v">48 · 3rem</span></div>
    <div class="row"><span class="name">--space-3xl</span><div class="bar" style="width:64px"></div><span class="v">64 · 4rem</span></div>
    <div class="row"><span class="name">--space-4xl</span><div class="bar" style="width:96px"></div><span class="v">96 · 6rem</span></div>
  </div>
</div>
</body></html>
