<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body {
    background:
      radial-gradient(ellipse at 50% -50%, oklch(0.20 0.06 145 / 0.4), transparent 60%),
      oklch(0.06 0.01 145);
  }
  .ds-card { padding: 20px; gap: 14px; }

  /* ─── Header ─── */
  .hdr {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; height: 62px;
    background: linear-gradient(180deg,
      oklch(0.10 0.02 145 / 0.92),
      oklch(0.06 0.01 145 / 0.92));
    backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid oklch(0.30 0.10 145 / 0.6);
    border-top-color: oklch(0.50 0.18 145 / 0.7);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 1px 0 oklch(0.60 0.22 145 / 0.2) inset,
      0 14px 30px oklch(0 0 0 / 0.5),
      0 0 32px oklch(0.50 0.28 145 / 0.18),
      0 18px 36px oklch(0.50 0.28 145 / 0.12);
  }
  .hdr::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 3px,
      oklch(0.50 0.28 145 / 0.025) 3px, oklch(0.50 0.28 145 / 0.025) 4px);
  }
  .hdr::after {
    content: ''; position: absolute; bottom: 0; left: -25%;
    width: 50%; height: 2px;
    background: linear-gradient(90deg, transparent,
      oklch(0.65 0.25 195), oklch(0.50 0.28 145), transparent);
    box-shadow: 0 0 14px oklch(0.50 0.28 145 / 0.7);
    animation: sweep 4s linear infinite;
  }
  @keyframes sweep { 0% { left: -25%; } 100% { left: 100%; } }

  /* ─── Brand ─── */
  .brand { display: flex; align-items: center; gap: 12px; position: relative; z-index: 2; }
  .logo-mark {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid oklch(0.50 0.28 145 / 0.7); border-radius: 6px;
    background: oklch(0.12 0.03 145 / 0.7);
    box-shadow: 0 0 14px oklch(0.50 0.28 145 / 0.4),
                inset 0 0 10px oklch(0.50 0.28 145 / 0.15);
    position: relative;
    transition: all 0.25s var(--ease-out);
    cursor: pointer;
  }
  .logo-mark::after {
    content: ''; position: absolute; inset: 4px;
    border: 1px solid oklch(0.50 0.28 145 / 0.3); border-radius: 3px;
    transition: inset 0.3s, border-color 0.3s;
  }
  .logo-mark span {
    font-family: 'Orbitron'; font-size: 12px; font-weight: 800;
    color: oklch(0.95 0.005 145); letter-spacing: -0.02em;
    text-shadow: 0 0 10px oklch(0.50 0.28 145 / 0.8);
    transition: text-shadow 0.25s;
  }
  .logo-mark:hover {
    transform: rotate(-3deg) scale(1.08);
    box-shadow: 0 0 24px oklch(0.50 0.28 145 / 0.7),
                inset 0 0 14px oklch(0.50 0.28 145 / 0.25);
    border-color: oklch(0.65 0.22 145);
  }
  .logo-mark:hover::after {
    inset: 2px; border-color: oklch(0.65 0.22 145 / 0.7);
  }
  .logo-mark:hover span {
    text-shadow: 0 0 18px oklch(0.50 0.28 145), 0 0 30px oklch(0.50 0.28 145 / 0.6);
    animation: glitch 0.4s steps(2) 1;
  }
  @keyframes glitch {
    0%   { transform: translate(0); }
    25%  { transform: translate(-1px, 1px); color: oklch(0.75 0.15 195); }
    50%  { transform: translate(1px, -1px); color: oklch(0.65 0.20 27); }
    75%  { transform: translate(-1px, 0); }
    100% { transform: translate(0); }
  }

  .logo-word {
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px; font-weight: 600;
    color: oklch(0.85 0.12 145);
    letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer;
    transition: color 0.2s, text-shadow 0.2s;
  }
  .logo-word:hover { color: #fff; text-shadow: 0 0 14px oklch(0.50 0.28 145 / 0.8); }
  .logo-word .gt { color: oklch(0.50 0.28 145 / 0.7); animation: gt-pulse 2s ease-in-out infinite; }
  @keyframes gt-pulse { 50% { opacity: 0.4; } }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    background: oklch(0.50 0.28 145 / 0.08);
    border: 1px solid oklch(0.50 0.28 145 / 0.25);
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    color: oklch(0.85 0.12 145);
    cursor: default;
    transition: all 0.25s;
  }
  .status-pill:hover {
    background: oklch(0.50 0.28 145 / 0.18);
    border-color: oklch(0.50 0.28 145 / 0.6);
    color: #fff;
  }
  .status-pill .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: oklch(0.65 0.22 145);
    box-shadow: 0 0 8px oklch(0.65 0.22 145), 0 0 14px oklch(0.65 0.22 145 / 0.6);
    animation: dot-pulse 1.6s ease-in-out infinite;
  }
  @keyframes dot-pulse { 50% { opacity: 0.4; transform: scale(0.85); } }

  /* ─── Nav with magnetic indicator ─── */
  nav.center {
    position: relative;
    display: flex; gap: 2px; align-items: center;
    padding: 4px;
    background: oklch(0.10 0.02 145 / 0.6);
    border: 1px solid oklch(0.22 0.04 145);
    border-radius: 10px;
    z-index: 2;
  }
  nav.center a {
    position: relative; z-index: 2;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; letter-spacing: 0.05em;
    padding: 8px 16px;
    border-radius: 7px;
    color: oklch(0.65 0.03 145);
    text-decoration: none;
    transition: color 0.2s, text-shadow 0.2s, transform 0.2s;
    overflow: hidden;
  }
  /* Magnetic indicator that slides between hovered/active items */
  .nav-indicator {
    position: absolute; top: 4px; bottom: 4px;
    border-radius: 7px;
    background: linear-gradient(180deg,
      oklch(0.18 0.04 145 / 0.95),
      oklch(0.12 0.03 145 / 0.95));
    box-shadow:
      inset 0 1px 0 oklch(0.50 0.28 145 / 0.35),
      0 0 16px oklch(0.50 0.28 145 / 0.22),
      0 2px 0 oklch(0.50 0.28 145 / 0.8);
    transition: left 0.32s cubic-bezier(0.65, 0, 0.35, 1),
                width 0.32s cubic-bezier(0.65, 0, 0.35, 1);
    pointer-events: none;
    z-index: 1;
  }
  nav.center a:hover {
    color: oklch(0.95 0.005 145);
    text-shadow: 0 0 12px oklch(0.50 0.28 145 / 0.6);
  }
  /* The "current" link gets bold styling — indicator handles tile background */
  nav.center a[data-current="true"] {
    color: #fff;
    text-shadow: 0 0 14px oklch(0.50 0.28 145 / 0.5);
  }
  /* Terminal '>' prefix on whichever link the indicator is under */
  nav.center a[data-active="true"]::before {
    content: '>'; color: oklch(0.50 0.28 145); margin-right: 6px;
    text-shadow: 0 0 10px oklch(0.50 0.28 145);
  }
  /* Scanning underline that follows hover */
  nav.center a::after {
    content: ''; position: absolute;
    left: 50%; right: 50%; bottom: 4px; height: 1px;
    background: linear-gradient(90deg, transparent, oklch(0.50 0.28 145), transparent);
    box-shadow: 0 0 8px oklch(0.50 0.28 145);
    opacity: 0;
    transition: left 0.3s var(--ease-out), right 0.3s var(--ease-out), opacity 0.2s;
  }
  nav.center a:hover::after { left: 16px; right: 16px; opacity: 1; }

  /* ─── Right cluster ─── */
  .util { display: flex; align-items: center; gap: 10px; position: relative; z-index: 2; }
  .clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 0.15em;
    color: oklch(0.55 0.03 145); text-align: right; line-height: 1.15;
  }
  .clock .v { color: oklch(0.85 0.12 145); }

  /* Command-K with sliding shimmer on hover */
  .cmdk {
    position: relative;
    display: inline-flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 8px 0 10px;
    border-radius: 7px;
    background: oklch(0.10 0.02 145);
    border: 1px solid oklch(0.22 0.04 145);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; color: oklch(0.55 0.03 145);
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
  }
  .cmdk::before {
    content: ''; position: absolute; top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent,
      oklch(0.50 0.28 145 / 0.18), transparent);
    transition: left 0.55s var(--ease-out);
  }
  .cmdk:hover {
    color: #fff;
    border-color: oklch(0.50 0.28 145 / 0.6);
    box-shadow: 0 0 18px oklch(0.50 0.28 145 / 0.25),
                inset 0 0 12px oklch(0.50 0.28 145 / 0.08);
  }
  .cmdk:hover::before { left: 130%; }
  .cmdk svg { width: 12px; height: 12px; position: relative; z-index: 1; }
  .cmdk kbd {
    font-family: 'Share Tech Mono', monospace; font-size: 9px;
    padding: 1px 5px; border-radius: 3px;
    background: oklch(0.06 0.01 145);
    color: oklch(0.50 0.28 145);
    border: 1px solid oklch(0.22 0.04 145);
    position: relative; z-index: 1;
    transition: all 0.2s;
  }
  .cmdk:hover kbd {
    background: oklch(0.50 0.28 145 / 0.15);
    color: #fff;
    border-color: oklch(0.50 0.28 145 / 0.6);
  }

  /* Icon button with ripple-like halo */
  .iconbtn {
    position: relative;
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    color: oklch(0.65 0.03 145);
    background: transparent; border: 0; border-radius: 7px;
    cursor: pointer; transition: all 0.25s;
    overflow: hidden;
  }
  .iconbtn::before {
    content: ''; position: absolute; inset: 50%;
    background: oklch(0.50 0.28 145 / 0.18);
    border-radius: 50%;
    transition: inset 0.35s var(--ease-out), opacity 0.35s;
    opacity: 0;
  }
  .iconbtn:hover {
    color: oklch(0.50 0.28 145);
    box-shadow: 0 0 16px oklch(0.50 0.28 145 / 0.3);
  }
  .iconbtn:hover::before { inset: 0; opacity: 1; }
  .iconbtn svg {
    width: 16px; height: 16px; position: relative; z-index: 1;
    transition: transform 0.4s var(--ease-elastic);
  }
  .iconbtn:hover svg { transform: rotate(180deg); }

  /* Notification dot on icon */
  .iconbtn--has-badge::after {
    content: ''; position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px; border-radius: 50%;
    background: oklch(0.80 0.18 85);
    border: 1.5px solid oklch(0.10 0.02 145);
    box-shadow: 0 0 8px oklch(0.80 0.18 85);
    animation: badge-pulse 1.8s ease-in-out infinite;
  }
  @keyframes badge-pulse { 50% { transform: scale(0.7); opacity: 0.7; } }

  /* Sub-caption */
  .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 0.15em; color: oklch(0.45 0.03 145);
  }
  .meta-row span::before { content: '// '; opacity: 0.6; }
</style></head>
<body data-theme="neon-terminal">
<div class="ds-card">
  <div class="ds-eyebrow">header / hover_states · magnetic_indicator</div>

  <header class="hdr">
    <div class="brand">
      <div class="logo-mark"><span>TB</span></div>
      <span class="logo-word"><span class="gt">&gt;</span>tom_butler</span>
      <span class="status-pill"><span class="dot"></span> online</span>
    </div>

    <nav class="center" id="nav">
      <div class="nav-indicator" id="ind"></div>
      <a href="#" data-current="true">Home</a>
      <a href="#">Projects</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>

    <div class="util">
      <div class="cmdk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Search
        <kbd>⌘K</kbd>
      </div>
      <div class="clock">
        <div>UTC <span class="v">14:32</span></div>
        <div>UP <span class="v">99.94%</span></div>
      </div>
      <button class="iconbtn iconbtn--has-badge" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
      <button class="iconbtn" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <div class="meta-row">
    <span>magnetic indicator follows hover, snaps to current on leave</span>
    <span>logo glitches on hover · icon rotates 180° elastic · search shimmers</span>
  </div>
</div>

<script>
  // Magnetic nav indicator — slides between links on hover, returns to current on leave
  const nav = document.getElementById('nav');
  const ind = document.getElementById('ind');
  const links = nav.querySelectorAll('a');
  function moveTo(el) {
    const navRect = nav.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    ind.style.left  = (r.left - navRect.left) + 'px';
    ind.style.width = r.width + 'px';
    links.forEach(a => a.removeAttribute('data-active'));
    el.setAttribute('data-active', 'true');
  }
  const current = nav.querySelector('a[data-current="true"]');
  requestAnimationFrame(() => moveTo(current));
  links.forEach(a => {
    a.addEventListener('mouseenter', () => moveTo(a));
  });
  nav.addEventListener('mouseleave', () => moveTo(current));
  window.addEventListener('resize', () => moveTo(nav.querySelector('a[data-active="true"]') || current));
</script>
</body></html>
