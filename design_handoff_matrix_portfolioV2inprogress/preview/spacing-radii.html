<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; flex: 1; align-items: end; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box {
    width: 84px; height: 64px;
    background: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.95));
    border: 1px solid var(--border-color);
    box-shadow: 0 0 12px var(--glow-color-subtle);
  }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-primary); }
  .v   { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style></head>
<body data-theme="matrix">
<div class="ds-card">
  <div class="ds-eyebrow">radii / corner_system</div>
  <div class="row">
    <div class="sw"><div class="box" style="border-radius:4px"></div><span class="lab">sm</span><span class="v">4px</span></div>
    <div class="sw"><div class="box" style="border-radius:6px"></div><span class="lab">base</span><span class="v">6px</span></div>
    <div class="sw"><div class="box" style="border-radius:8px"></div><span class="lab">md</span><span class="v">8px ★ v4</span></div>
    <div class="sw"><div class="box" style="border-radius:12px"></div><span class="lab">lg</span><span class="v">12px</span></div>
    <div class="sw"><div class="box" style="border-radius:16px"></div><span class="lab">xl</span><span class="v">16px</span></div>
    <div class="sw"><div class="box" style="border-radius:9999px; width:64px"></div><span class="lab">full</span><span class="v">9999px</span></div>
  </div>
</div>
</body></html>
