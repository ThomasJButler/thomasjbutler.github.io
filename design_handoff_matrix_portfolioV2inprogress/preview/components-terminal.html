<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .ds-card { gap: 14px; padding-top: 16px; }
  .term {
    border: 1px solid oklch(0.22 0.04 145 / 0.6);
    border-radius: 12px; overflow: hidden;
    background: oklch(0.08 0.01 145);
  }
  .term-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: oklch(0.14 0.02 145 / 0.5);
    border-bottom: 1px solid oklch(0.22 0.04 145 / 0.5);
  }
  .dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: oklch(0.65 0.20 27 / 0.7); }
  .dot.y { background: oklch(0.80 0.15 85 / 0.7); }
  .dot.g { background: oklch(0.65 0.20 145 / 0.7); }
  .term-bar .path {
    font-family: 'JetBrains Mono'; font-size: 10px;
    color: oklch(0.60 0.03 145); margin-left: 6px;
  }
  .term-body { padding: 18px 20px; }
  .h1 {
    font-family: 'Orbitron'; font-size: 36px; font-weight: 700;
    color: oklch(0.95 0.005 145); letter-spacing: 0.02em; line-height: 1;
    text-shadow: 0 0 20px oklch(0.50 0.28 145 / 0.15);
    margin: 0;
  }
  .typing {
    margin-top: 8px;
    font-family: 'Share Tech Mono'; font-size: 16px; color: oklch(0.65 0.03 145);
  }
  .typing .pre  { color: oklch(0.50 0.28 145 / 0.6); }
  .typing .word { color: oklch(0.50 0.28 145); }
  .typing .cur  {
    display: inline-block; width: 0.55em; height: 1em;
    background: oklch(0.50 0.28 145 / 0.8);
    vertical-align: text-bottom; margin-left: 2px;
    animation: blink 1s steps(2) infinite;
    box-shadow: 0 0 8px oklch(0.50 0.28 145 / 0.4);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { margin-top: 8px; font-family: 'Exo 2'; font-size: 13px; color: oklch(0.60 0.03 145); }
</style></head>
<body data-theme="neon-terminal">
<div class="ds-card">
  <div class="ds-eyebrow">terminal_window / hero_frame</div>
  <div class="term">
    <div class="term-bar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <span class="path">tom@matrix ~ </span>
    </div>
    <div class="term-body">
      <h1 class="h1">Hey, I&rsquo;m Tom</h1>
      <div class="typing"><span class="pre">// I build </span><span class="word">AI&#8209;powered apps</span><span class="cur"></span></div>
      <div class="sub">Full Stack AI Engineer from the UK</div>
    </div>
  </div>
</div>
</body></html>
