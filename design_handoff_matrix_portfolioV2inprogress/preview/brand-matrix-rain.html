<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #000; }
  .ds-card { padding: 0; gap: 0; position: relative; overflow: hidden; min-height: 220px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  .scanlines {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,255,0,0.035) 2px, rgba(0,255,0,0.035) 4px);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.7) 100%);
  }
  .overlay {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 16px 22px; pointer-events: none;
  }
  .eyebrow {
    font-family: var(--font-mono); font-size: 10px;
    color: rgba(0,255,140,0.75); letter-spacing: 0.2em;
  }
  .eyebrow::before { content: '// '; opacity: 0.55; }
  .label {
    font-family: 'Orbitron'; font-size: 14px;
    letter-spacing: 0.18em; color: #d8ffd8;
    text-shadow: 0 0 12px rgba(0,255,90,0.7);
  }
</style></head>
<body data-theme="matrix">
<div class="ds-card">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="overlay">
    <span class="eyebrow">matrix_rain / digital_rain · film_accurate</span>
    <span class="label">DIGITAL RAIN — SIGNATURE BACKDROP</span>
  </div>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// The film's glyph set: half-width katakana + a few latin digits, drawn MIRRORED
// (the production flipped the characters horizontally). We pre-render each glyph
// once to an offscreen tile so the per-frame draw is cheap and consistently mirrored.
const GLYPHS = ('ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'
  + '0123456789' + 'ﾊﾐﾋｰｳｼﾅﾓﾆ').split('');

const FONT_SIZE = 16;   // glyph cell size
const HEAD = '#c9ffd2'; // near-white leading glyph
let cols = 0, columns = [];

function size() {
  const w = c.clientWidth || c.parentElement.clientWidth || window.innerWidth;
  const h = c.clientHeight || c.parentElement.clientHeight || window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.floor(w * dpr);
  c.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  c._w = w; c._h = h;
  init(w, h);
}

function init(w, h) {
  cols = Math.ceil(w / FONT_SIZE);
  columns = Array.from({ length: cols }, () => spawn(h, true));
}

// A falling stream. The film's columns vary in speed and length, pause, and
// the head glyph is the brightest — trailing glyphs fade to deep green.
function spawn(h, randomStart) {
  return {
    head: randomStart ? Math.random() * (h / FONT_SIZE) : -Math.random() * 20,
    speed: 0.18 + Math.random() * 0.55,         // rows per frame
    len: 8 + Math.floor(Math.random() * 22),     // trail length
    glyphs: [],
    tick: 0,
    mutate: 0.04 + Math.random() * 0.06          // chance a cell swaps glyph
  };
}

function draw() {
  const w = c._w, h = c._h;
  // Low-alpha black wash leaves long phosphor trails like the film.
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, 0, w, h);
  ctx.font = '600 ' + FONT_SIZE + 'px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let x = 0; x < cols; x++) {
    const s = columns[x];
    s.tick += s.speed;
    if (s.tick >= 1) { s.head += Math.floor(s.tick); s.tick = 0; }

    const cx = x * FONT_SIZE + FONT_SIZE / 2;

    for (let i = 0; i < s.len; i++) {
      const row = Math.floor(s.head) - i;
      if (row < 0) continue;
      const py = row * FONT_SIZE + FONT_SIZE / 2;
      if (py < -FONT_SIZE || py > h + FONT_SIZE) continue;

      // Pick/mutate the glyph for this trailing position.
      if (!s.glyphs[i] || Math.random() < 0.012) {
        s.glyphs[i] = GLYPHS[(Math.random() * GLYPHS.length) | 0];
      }
      const g = s.glyphs[i];

      ctx.save();
      // Mirror horizontally about the glyph centre — the film's signature flip.
      ctx.translate(cx, py);
      ctx.scale(-1, 1);

      if (i === 0) {
        // Leading glyph: bright near-white with a strong bloom.
        ctx.shadowColor = 'rgba(120,255,150,0.9)';
        ctx.shadowBlur = 14;
        ctx.fillStyle = HEAD;
      } else {
        // Trail: green, brighter near the head, fading to deep green.
        const t = i / s.len;                 // 0 at head → 1 at tail
        const light = 0.95 - t * 0.78;       // luminance falloff
        const alpha = 1 - t * 0.85;
        ctx.shadowColor = 'rgba(0,255,70,0.55)';
        ctx.shadowBlur = i < 4 ? 8 : 3;
        ctx.fillStyle = 'rgba(' +
          Math.round(20 + light * 40) + ',' +
          Math.round(120 + light * 135) + ',' +
          Math.round(40 + light * 60) + ',' + alpha.toFixed(3) + ')';
      }
      ctx.fillText(g, 0, 0);
      ctx.restore();
    }

    // Recycle the stream once its head has fully passed the bottom.
    if ((Math.floor(s.head) - s.len) * FONT_SIZE > h) {
      columns[x] = spawn(h, false);
    }
  }
  requestAnimationFrame(draw);
}

size();
requestAnimationFrame(size);
window.addEventListener('load', size);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(size);
window.addEventListener('resize', size);
draw();
</script>
</body></html>
