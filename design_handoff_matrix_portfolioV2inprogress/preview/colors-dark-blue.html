<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; flex: 1; }
  .sw { display: flex; flex-direction: column; gap: 4px; }
  .sw .chip { height: 64px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); }
  .sw .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-primary); }
  .sw .val  { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .note { font-family: var(--font-body); font-size: 11px; color: var(--text-muted);
          max-width: 60ch; line-height: 1.5; }
</style></head>
<body data-theme="dark">
<div class="ds-card">
  <div class="ds-eyebrow">dark_blue / v3_5_retired</div>
  <span class="note">v3.5 shipped a second theme where every green is force‑overridden to blue. Retired in v4.0 in favour of the Circuit Board light theme — but the variables ship for parity.</span>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#4A9EFF; box-shadow:0 0 12px rgba(74,158,255,0.45)"></div><span class="name">accent</span><span class="val">#4A9EFF</span></div>
    <div class="sw"><div class="chip" style="background:#5AADFF; box-shadow:0 0 12px rgba(90,173,255,0.45)"></div><span class="name">hover</span><span class="val">#5AADFF</span></div>
    <div class="sw"><div class="chip" style="background:rgba(74,158,255,0.3); box-shadow:none"></div><span class="name">border</span><span class="val">α 0.3</span></div>
    <div class="sw"><div class="chip" style="background:#1B3A66"></div><span class="name">muted</span><span class="val">#1B3A66</span></div>
    <div class="sw"><div class="chip" style="background:#0f0f0f"></div><span class="name">surface</span><span class="val">#0f0f0f</span></div>
    <div class="sw"><div class="chip" style="background:#000000; border:1px solid rgba(74,158,255,0.3)"></div><span class="name">void</span><span class="val">#000000</span></div>
  </div>
</div>
</body></html>
