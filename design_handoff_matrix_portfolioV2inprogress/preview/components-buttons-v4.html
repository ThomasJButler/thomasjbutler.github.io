<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .btns { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
  .btn {
    font-family: 'Exo 2'; font-weight: 500; font-size: 13px;
    height: 36px; padding: 0 14px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer; border: none; transition: all 0.2s;
    text-decoration: none;
  }
  .btn svg { width: 14px; height: 14px; }
  .b-default {
    background: oklch(0.50 0.28 145); color: oklch(0.08 0.01 145);
    box-shadow: 0 0 16px oklch(0.50 0.28 145 / 0.18);
  }
  .b-default:hover { background: oklch(0.50 0.28 145 / 0.85);
                     box-shadow: 0 0 24px oklch(0.50 0.28 145 / 0.3); }
  .b-outline {
    background: transparent; color: oklch(0.85 0.12 145);
    border: 1px solid oklch(0.50 0.28 145 / 0.3);
  }
  .b-outline:hover { border-color: oklch(0.50 0.28 145 / 0.6);
                     background: oklch(0.50 0.28 145 / 0.05);
                     color: oklch(0.50 0.28 145); }
  .b-secondary {
    background: oklch(0.18 0.025 145); color: oklch(0.85 0.12 145);
  }
  .b-ghost { background: transparent; color: oklch(0.65 0.03 145); }
  .b-ghost:hover { background: oklch(0.18 0.025 145); color: oklch(0.95 0.005 145); }
  .b-destructive { background: oklch(0.55 0.20 25 / 0.1); color: oklch(0.55 0.20 25); }
  .b-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
  .b-xs { height: 24px; padding: 0 8px; font-size: 11px; border-radius: 6px; gap: 4px; }
  .b-xs svg { width: 12px; height: 12px; }
  .row { display: flex; gap: 12px; align-items: center; }
</style></head>
<body data-theme="neon-terminal">
<div class="ds-card">
  <div class="ds-eyebrow">buttons / neon_terminal_v4</div>
  <div class="btns">
    <button class="btn b-default">View Projects
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button class="btn b-outline">Get in Touch</button>
    <button class="btn b-secondary">Filter</button>
    <button class="btn b-ghost">Cancel</button>
    <button class="btn b-destructive">Delete</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn b-default b-sm">size=sm</button>
    <button class="btn b-outline b-xs">size=xs</button>
    <button class="btn b-default b-xs">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-1.93c-3.2.7-3.87-1.54-3.87-1.54-.52-1.34-1.28-1.7-1.28-1.7-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.03 0 0 .96-.31 3.15 1.17.91-.25 1.89-.38 2.87-.38s1.96.13 2.87.38c2.18-1.48 3.15-1.17 3.15-1.17.62 1.58.23 2.74.11 3.03.73.8 1.18 1.82 1.18 3.07 0 4.42-2.69 5.38-5.25 5.67.42.36.78 1.05.78 2.12v3.14c0 .31.21.67.8.55C20.21 21.39 23.5 17.07 23.5 12c0-6.35-5.15-11.5-11.5-11.5z"/></svg>
      GitHub
    </button>
  </div>
</div>
</body></html>
