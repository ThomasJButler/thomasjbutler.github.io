<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #000; }
  .ds-card { padding: 0; gap: 0; position: relative; overflow: hidden; min-height: 220px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  .glass {
    position: absolute; inset: 22px 22px 22px 22px;
    background: oklch(0.06 0.01 145 / 0.88);
    backdrop-filter: blur(32px) saturate(1.5);
    -webkit-backdrop-filter: blur(32px) saturate(1.5);
    border: 1px solid oklch(0.28 0.08 145 / 0.35);
    border-top-color: oklch(0.40 0.18 145 / 0.25);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 0 28px oklch(0.50 0.28 145 / 0.08);
    z-index: 2;
  }
  .glass .eyebrow { font-family: var(--font-mono); font-size: 10px;
                    letter-spacing: 0.2em; color: oklch(0.50 0.28 145 / 0.7); }
  .glass .eyebrow::before { content: '// '; opacity: 0.55; }
  .glass h4 { font-family: 'Orbitron'; margin: 0;
              color: oklch(0.95 0.005 145); font-size: 16px; letter-spacing: 0.1em;
              text-shadow: 0 0 20px oklch(0.50 0.28 145 / 0.2); }
  .glass p  { margin: 0; font-family: 'Exo 2'; font-size: 12px;
              color: oklch(0.65 0.03 145); line-height: 1.5; max-width: 60ch; }
</style></head>
<body data-theme="neon-terminal">
<div class="ds-card">
  <canvas id="c"></canvas>
  <div class="glass">
    <span class="eyebrow">glass_panel / 32px_blur</span>
    <h4>READABLE CONTENT OVER MATRIX RAIN</h4>
    <p>Whenever real copy sits over the rain canvas, wrap it in a <code style="font-family:var(--font-mono);font-size:11px;color:oklch(0.50 0.28 145)">.glass-panel</code> — 32px backdrop‑blur, 88% opacity, double‑border top accent.</p>
  </div>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const chars = 'ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ01';
const fontSize = 14;
const colStep = fontSize; // one column per font cell — fills the full horizon
let drops = [];
function size() {
  // Use the element's rendered box; fall back to viewport if not yet laid out.
  const w = c.clientWidth || c.parentElement.clientWidth || window.innerWidth;
  const h = c.clientHeight || c.parentElement.clientHeight || window.innerHeight;
  c.width = w;
  c.height = h;
  init();
}
function init() {
  const cols = Math.ceil(c.width / colStep);
  drops = Array.from({length: cols}, () => ({
    y: Math.random() * c.height,
    speed: Math.random() * 0.5 + 0.2,
    chars: Array.from({length: Math.floor(c.height/fontSize)+10}, () => chars[Math.floor(Math.random()*chars.length)]),
    brightness: Math.random() * 0.4 + 0.3
  }));
}
function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.font = fontSize + 'px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  for (let x=0; x<drops.length; x++) {
    const d = drops[x]; d.y += d.speed;
    if (d.y > c.height && Math.random() > 0.97) { d.y = -d.chars.length*fontSize; }
    const len = d.chars.length;
    for (let i=0; i<len; i++) {
      const py = d.y + i*fontSize;
      if (py < -fontSize || py > c.height+fontSize) continue;
      const fade = (1 - (i/len)*0.85) * d.brightness;
      ctx.fillStyle = i >= len-2 ? `rgba(200,255,200,${Math.min(fade*1.5,0.9)})` : `rgba(0,200,0,${fade*0.7})`;
      if (Math.random() < 0.003) d.chars[i] = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(d.chars[i], x*colStep + colStep/2, py);
    }
  }
  requestAnimationFrame(draw);
}
// Size now, after layout settles, and after fonts load — guards the 300px-default bug.
size();
requestAnimationFrame(size);
window.addEventListener('load', size);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(size);
window.addEventListener('resize', size);
draw();
</script>
</body></html>
