<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .ds-card { gap: 8px; }
  .specimen { font-family: 'Orbitron', sans-serif; color: var(--text-primary);
              text-shadow: var(--glow-triple-layer); }
  .big { font-size: 56px; font-weight: 700; letter-spacing: 0.15em;
         line-height: 1; text-transform: uppercase; }
  .med { font-size: 22px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
  .meta { display: flex; gap: 24px; font-family: var(--font-mono); font-size: 11px;
          color: var(--text-muted); }
  .meta span strong { color: var(--text-primary); font-weight: 400; }
  .weights { display: flex; gap: 18px; font-family: 'Orbitron'; color: var(--text-primary); }
  .weights div { font-size: 18px; letter-spacing: 0.1em; }
</style></head>
<body data-theme="matrix">
<div class="ds-card">
  <div class="ds-eyebrow">font_display / orbitron</div>
  <div class="specimen big">HEY, I&rsquo;M TOM</div>
  <div class="specimen med">// SYSTEM STATUS — ONLINE</div>
  <div class="weights">
    <div style="font-weight:400">400 · regular</div>
    <div style="font-weight:500">500 · medium</div>
    <div style="font-weight:600">600 · semibold</div>
    <div style="font-weight:700">700 · bold</div>
    <div style="font-weight:900">900 · black</div>
  </div>
  <div class="meta">
    <span><strong>Used for</strong> h1–h3 · logo · nav · buttons</span>
    <span><strong>Letter‑spacing</strong> 0.10–0.20em wider</span>
    <span><strong>Case</strong> UPPER (v3.5) / Title (v4.0)</span>
  </div>
</div>
</body></html>
