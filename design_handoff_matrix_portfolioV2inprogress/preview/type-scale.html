<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .ds-card { gap: 6px; }
  .row { display: grid; grid-template-columns: 110px 1fr; align-items: baseline; gap: 12px;
         padding: 4px 0; border-bottom: 1px dashed rgba(0,255,0,0.08); }
  .row:last-of-type { border-bottom: 0; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
           letter-spacing: 0.1em; }
  .label .px { color: var(--accent-color); }
  .demo { color: var(--text-primary); }
  .h1 { font-family: 'Orbitron'; font-size: 44px; font-weight: 700;
        letter-spacing: 0.15em; text-transform: uppercase; line-height: 1; }
  .h2 { font-family: 'Orbitron'; font-size: 30px; font-weight: 600;
        letter-spacing: 0.15em; text-transform: uppercase; }
  .h3 { font-family: 'Orbitron'; font-size: 22px; font-weight: 500;
        letter-spacing: 0.08em; text-transform: uppercase; }
  .h4 { font-family: 'Exo 2'; font-size: 18px; font-weight: 600; }
  .h5 { font-family: 'Exo 2'; font-size: 16px; font-weight: 500; }
  .body { font-family: 'Exo 2'; font-size: 15px; line-height: 1.65; color: var(--text-base); }
</style></head>
<body data-theme="matrix">
<div class="ds-card">
  <div class="ds-eyebrow">type_scale / clamp_fluid</div>
  <div class="row"><span class="label">h1 <span class="px">/ 4xl</span></span><div class="demo h1">PROJECTS</div></div>
  <div class="row"><span class="label">h2 <span class="px">/ 2xl</span></span><div class="demo h2">FEATURED WORK</div></div>
  <div class="row"><span class="label">h3 <span class="px">/ xl</span></span><div class="demo h3">PROJECT NAME</div></div>
  <div class="row"><span class="label">h4 <span class="px">/ lg</span></span><div class="demo h4">Card subtitle</div></div>
  <div class="row"><span class="label">h5 <span class="px">/ md</span></span><div class="demo h5">Smaller heading</div></div>
  <div class="row"><span class="label">body <span class="px">/ base</span></span><div class="demo body">Production paragraph copy at 15–18px, line-height 1.65, comfortable for long-form.</div></div>
</div>
</body></html>
