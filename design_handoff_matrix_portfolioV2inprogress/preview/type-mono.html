<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .ds-card { gap: 12px; }
  .col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; flex: 1; }
  .lane { display: flex; flex-direction: column; gap: 6px;
          border: 1px solid var(--border-color); border-radius: 8px; padding: 14px;
          background: rgba(0,0,0,0.4); }
  .name { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.12em;
          text-transform: uppercase; color: var(--text-primary); }
  .sample-stm { font-family: 'Share Tech Mono', monospace; color: var(--matrix-cyan);
                font-size: 22px; line-height: 1.4; }
  .sample-jbm { font-family: 'JetBrains Mono', monospace; color: oklch(0.85 0.12 145);
                font-size: 16px; line-height: 1.5; }
  .role { font-family: 'Exo 2'; font-size: 11px; color: var(--text-muted); margin-top: auto; }
  .ascii { font-family: 'Share Tech Mono'; font-size: 13px; color: var(--matrix-green); }
</style></head>
<body data-theme="matrix">
<div class="ds-card">
  <div class="ds-eyebrow">monospace / terminal_voice</div>
  <div class="col">
    <div class="lane">
      <span class="name">Share Tech Mono</span>
      <div class="sample-stm">$ cat about.md</div>
      <div class="sample-stm">// system_status</div>
      <span class="role">Inline code · comment labels · v3.5 default mono. Loaded as <code style="font-family:inherit">'Share Tech Mono'</code>.</span>
    </div>
    <div class="lane">
      <span class="name">JetBrains Mono</span>
      <div class="sample-jbm">tom@matrix ~ %</div>
      <div class="sample-jbm">ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵ 01</div>
      <span class="role">Terminal windows · digital‑rain canvas font (v4.0). 400/500/600/700.</span>
    </div>
  </div>
</div>
</body></html>
