<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #000; }
  .ds-card { gap: 18px; position: relative; overflow: hidden; padding-top: 18px; }

  /* Scanline overlay across whole card for that CRT feel */
  .ds-card::after {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px,
      rgba(0,255,0,0.04) 2px, rgba(0,255,0,0.04) 4px);
  }
  .ds-card > * { position: relative; z-index: 2; }

  .btns {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: stretch;
    padding-top: 4px;
  }

  /* Base — frame with corner brackets, scanlines, phosphor pulse */
  .m-btn {
    --c: #00FF00;
    position: relative;
    padding: 12px 26px 12px 26px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--c);
    background: rgba(0, 20, 0, 0.5);
    border: 1px solid var(--c);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
    text-shadow: 0 0 8px rgba(0,255,0,0.7);
    box-shadow:
      0 0 12px rgba(0,255,0,0.35),
      inset 0 0 12px rgba(0,255,0,0.08);
    transition: all 0.25s ease;
    display: inline-flex; align-items: center; gap: 10px;
  }
  /* Corner brackets — square the chrome */
  .m-btn::before,
  .m-btn::after {
    content: ''; position: absolute;
    width: 10px; height: 10px;
    border: 1px solid var(--c);
    pointer-events: none;
    transition: all 0.25s ease;
  }
  .m-btn::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .m-btn::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  /* Internal scanline texture inside the button */
  .m-btn > .scan {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px,
      rgba(0,255,0,0.06) 2px, rgba(0,255,0,0.06) 3px);
    pointer-events: none;
    opacity: 0.7;
  }
  .m-btn > .label { position: relative; z-index: 2; }
  .m-btn > .prompt {
    position: relative; z-index: 2;
    color: rgba(0,255,0,0.55);
  }
  .m-btn > .cur {
    display: inline-block; width: 0.55em; height: 1em;
    background: var(--c); margin-left: 4px;
    vertical-align: text-bottom;
    box-shadow: 0 0 8px var(--c);
    animation: cblink 1s steps(2) infinite;
  }
  @keyframes cblink { 50% { opacity: 0; } }

  /* Sweeping highlight on hover */
  .m-btn > .sweep {
    position: absolute; top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent,
      rgba(0,255,0,0.18), transparent);
    transition: left 0.5s ease;
    pointer-events: none;
  }
  .m-btn:hover > .sweep { left: 120%; }

  .m-btn:hover {
    color: #000;
    background: var(--c);
    text-shadow: 0 0 4px rgba(255,255,255,0.6);
    box-shadow:
      0 0 22px rgba(0,255,0,0.7),
      0 0 60px rgba(0,255,0,0.3),
      inset 0 0 24px rgba(0,255,0,0.4);
  }
  .m-btn:hover::before, .m-btn:hover::after {
    width: 14px; height: 14px;
    box-shadow: 0 0 8px var(--c);
  }

  /* Filled CTA (default state already filled-ish) */
  .m-btn--filled {
    background: rgba(0, 255, 0, 0.15);
    color: #fff;
    box-shadow:
      0 0 18px rgba(0,255,0,0.5),
      inset 0 0 18px rgba(0,255,0,0.15);
  }

  /* Yellow attention CTA */
  .m-btn--cta {
    --c: #FFEA00;
    background: rgba(40, 35, 0, 0.5);
    color: #FFEA00;
    text-shadow: 0 0 10px rgba(255,234,0,0.8);
    box-shadow:
      0 0 16px rgba(255,234,0,0.5),
      inset 0 0 14px rgba(255,234,0,0.12);
  }
  .m-btn--cta .prompt { color: rgba(255,234,0,0.6); }
  .m-btn--cta:hover {
    background: #FFEA00; color: #000;
    box-shadow:
      0 0 28px rgba(255,234,0,0.9),
      0 0 70px rgba(255,234,0,0.35),
      inset 0 0 24px rgba(255,234,0,0.5);
  }

  /* Cyan ghost (links / secondary nav) */
  .m-btn--ghost {
    --c: #00FFFF;
    background: transparent;
    color: #00FFFF;
    border-color: rgba(0,255,255,0.45);
    text-shadow: 0 0 8px rgba(0,255,255,0.7);
    box-shadow:
      0 0 10px rgba(0,255,255,0.25),
      inset 0 0 10px rgba(0,255,255,0.05);
  }
  .m-btn--ghost:hover {
    background: rgba(0,255,255,0.15); color: #fff;
    box-shadow:
      0 0 22px rgba(0,255,255,0.7),
      inset 0 0 16px rgba(0,255,255,0.25);
  }

  /* Red danger */
  .m-btn--danger {
    --c: #FF2040;
    background: rgba(40, 0, 0, 0.5);
    color: #FF4060;
    text-shadow: 0 0 8px rgba(255,32,64,0.7);
    box-shadow:
      0 0 14px rgba(255,32,64,0.4),
      inset 0 0 14px rgba(255,32,64,0.1);
  }
  .m-btn--danger:hover {
    background: #FF2040; color: #fff;
    box-shadow:
      0 0 24px rgba(255,32,64,0.8),
      inset 0 0 20px rgba(255,255,255,0.2);
  }
</style></head>
<body data-theme="matrix">
<div class="ds-card">
  <div class="ds-eyebrow">buttons / matrix_v3_5 · terminal_command</div>

  <div class="btns">
    <button class="m-btn">
      <span class="prompt">&gt;</span><span class="label">View Projects</span>
      <span class="scan"></span><span class="sweep"></span>
    </button>

    <button class="m-btn m-btn--filled">
      <span class="prompt">&gt;</span><span class="label">Contact Me</span>
      <span class="scan"></span><span class="sweep"></span>
    </button>

    <button class="m-btn m-btn--cta">
      <span class="prompt">[</span><span class="label">Enter Showcase</span><span class="prompt">]</span>
      <span class="scan"></span><span class="sweep"></span>
    </button>

    <button class="m-btn m-btn--ghost">
      <span class="label">Skip</span><span class="cur"></span>
      <span class="scan"></span><span class="sweep"></span>
    </button>

    <button class="m-btn m-btn--danger">
      <span class="prompt">!</span><span class="label">Destroy Session</span>
      <span class="scan"></span><span class="sweep"></span>
    </button>
  </div>
</div>
</body></html>
