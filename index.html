<!DOCTYPE html>

    <title>Tom Butler | Full Stack AI Engineer, Local AI &amp; On-Device Systems</title>

      content="Full Stack AI Engineer in York, UK. I set up private, local AI systems for businesses: Ollama and open-model LLM setups, private RAG knowledge systems, AI cost and privacy audits, plus web apps and automation."

    <link rel="canonical" href="https://thomasjbutler.github.io/" />
    <meta name="theme-color" content="#0b1410" />

    <!--
      Set the theme before first paint.

      ThemeProvider only applies `.dark` once React has mounted, so a dark-mode visitor
      saw a white flash on every cold load. This is the one script we want blocking.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!--
      Icons. Deliberately no SVG icon: public/logo.svg is a 210 KB traced raster full
      of path soup, and browsers prefer the SVG when it's offered — so it was the
      favicon nobody wanted, at 200x the size.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Social. Must be a raster: X, LinkedIn, Facebook and Slack all ignore SVG. -->
